name: Database migration validation

on:
  pull_request:
    paths:
      - 'scripts/migrations/**'
      - 'scripts/database-migrations/**'
      - 'src/_tests_/database-migration-control.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/database-migration-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/migrations/**'
      - 'scripts/database-migrations/**'
      - 'src/_tests_/database-migration-control.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/database-migration-validation.yml'

permissions:
  contents: read

concurrency:
  group: database-migration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate migration manifest and checksums
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration manifest
        run: npm run db:migrations:validate

      - name: Run migration-control tests
        run: npm test -- --runInBand src/_tests_/database-migration-control.test.ts
