# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mycaresight-uat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'homesight-app/MyCareSight-Dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.UAT_NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.UAT_NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.UAT_NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_DEBUG_CAREGIVER_DOCS: ${{ secrets.UAT_NEXT_PUBLIC_DEBUG_CAREGIVER_DOCS }}
          AUTH_SECRET: ${{ secrets.UAT_AUTH_SECRET }}
          AUTH_URL: ${{ secrets.UAT_AUTH_URL }}
          DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.UAT_AZURE_STORAGE_ACCOUNT_NAME }}
          AGENCY_SSN_KEY: ${{ secrets.UAT_AGENCY_SSN_KEY }}
          MAILGUN_API_KEY: ${{ secrets.UAT_MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.UAT_MAILGUN_DOMAIN }}
          MAILGUN_FROM_EMAIL: ${{ secrets.UAT_MAILGUN_FROM_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.UAT_TURNSTILE_SECRET_KEY }}
        run: |
          npm run build

      - name: Prepare standalone artifact
        run: |
          mkdir deploy
          cp -R .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then cp -R public deploy/public; fi

      - name: Verify standalone artifact
        run: |
          test -f deploy/server.js
          test -d deploy/.next
          test -f deploy/.next/BUILD_ID
          echo "Standalone artifact verified"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
          include-hidden-files: true

  deploy:
    if: github.repository == 'homesight-app/MyCareSight-Dev'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_197393B814204234BDA58EF923D8AE21 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DB9AF30FE95446C89C917CAE18946A66 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AC846ECDEDA54AD0A8168CFED1DBD250 }}

      - name: Verify UAT subscription
        shell: bash
        env:
          EXPECTED_UAT_SUBSCRIPTION_ID: a268ab63-b7ec-490d-a858-0de0be69ed4f
        run: |
          active_subscription_id="$(az account show --query id --output tsv)"
          if [ "$active_subscription_id" != "$EXPECTED_UAT_SUBSCRIPTION_ID" ]; then
            echo "::error::Deployment is restricted to the MyCareSight-Dev-UAT subscription."
            exit 1
          fi

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mycaresight-uat'
          # Azure default slot of the UAT app; this is not the production platform.
          slot-name: 'Production'
          package: deploy
          startup-command: 'node server.js'
          
